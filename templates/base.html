<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Qual é o seu signo?{% endblock %} | Meu Signo</title>
  <meta name="description" content="{% block descricao %}Descubra seu signo pela data de nascimento e veja elemento, planeta regente, qualidades e compatibilidades.{% endblock %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="visually-hidden-focusable" href="#conteudo">Ir para o conteúdo</a>

  <header class="topo">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <a class="marca" href="{{ url_for('index') }}">Meu Signo</a>
      <a class="link-topo" href="{{ url_for('index') }}">Descobrir meu signo</a>
    </div>
  </header>

  <main id="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="rodape">
    <div class="container py-4">
      <p class="mb-0">Astrologia é uma tradição cultural, sem comprovação científica. Use por diversão e autoconhecimento. Nos dias de mudança de signo, a data exata pode variar em um dia conforme o ano.</p>
    </div>
  </footer>
</body>
</html>
